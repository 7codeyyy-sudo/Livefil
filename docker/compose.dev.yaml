# 本地开发数据库。
#
# 数据卷映射到项目内的 .runtime/postgres（相对本文件所在目录解析），
# 不使用 Docker 命名卷，也不写入系统盘用户目录。
#
# 启动：docker compose -f docker/compose.dev.yaml up -d
# 停止：docker compose -f docker/compose.dev.yaml down
# 查看状态：docker compose -f docker/compose.dev.yaml ps
#
# 注意：本文件中的默认取值仅供本地开发，不得用于测试或生产环境。

name: livefil-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: livefil-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livefil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livefil_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-livefil_dev}
      # 容器时区固定 UTC，与应用「时间一律以 UTC 存储」的约定保持一致。
      TZ: UTC
      PGTZ: UTC
    ports:
      # 仅绑定本机回环地址，避免开发库暴露到局域网。
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ../.runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-livefil} -d ${POSTGRES_DB:-livefil_dev}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
